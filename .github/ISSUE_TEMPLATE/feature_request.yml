name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Leave out customer or organization names and work item details.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches or screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it now?
      description: Workarounds you use today, if any.
